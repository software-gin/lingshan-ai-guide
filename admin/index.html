/* Popconfirm */
.el-popconfirm { color: var(--text-body) !important; }
.el-popconfirm__main { font-size: var(--font-size-md); color: var(--text-body); margin-bottom: 12px; }

/* Badge */
.el-badge__content { border: none !important; font-size: 10px !important; height: 18px !important; min-width: 18px !important; line-height: 18px !important; }
.el-badge__content.is-dot { width: 8px !important; height: 8px !important; }

/* Utility classes */
.page-title { font-size: var(--font-size-xl); font-weight: 600; color: var(--text-primary); margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid var(--primary); display: inline-block; letter-spacing: .5px; }
.search-form { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
.search-card { margin-bottom: 16px; }
.filter-bar { margin-bottom: 16px; }
.filter-bar .el-row { align-items: center; }
.stats-row { margin-bottom: 16px; }
.action-row { margin-bottom: 16px; }
.stat-card { text-align: center; padding: 20px 16px !important; }
.stat-card .stat-value { font-size: 28px; font-weight: 700; color: var(--primary); margin: 6px 0; }
.stat-card .stat-label { font-size: var(--font-size-base); color: var(--text-secondary); margin-bottom: 4px; }
.pagination { margin-top: 16px; display: flex; justify-content: flex-end; }
.detail-content { line-height: 1.8; }
.detail-item { margin-bottom: 16px; }
.detail-item label { font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 4px; font-size: var(--font-size-base); }
.detail-item p { color: var(--text-body); background: rgba(0, 136, 153, 0.06); padding: 12px; border-radius: 8px; white-space: pre-wrap; font-size: var(--font-size-md); border: 1px solid rgba(0, 136, 153, 0.1); }
.detail-meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: var(--font-size-sm); color: var(--text-muted); }
.config-tips { color: var(--text-body); font-size: var(--font-size-base); line-height: 1.8; }
.config-tips h4 { color: var(--text-secondary); font-size: var(--font-size-md); margin-bottom: 8px; }
.config-tips ul { padding-left: 18px; }
.config-tips li { margin-bottom: 4px; }
.el-card .stat-value { color: var(--primary); }
.el-table .el-button.is-link { padding: 0 4px !important; }
.el-table .el-button.is-link + .el-button.is-link { margin-left: 4px; }

/* Empty */
.el-empty__description p { color: var(--text-body) !important; font-size: var(--font-size-base); }

/* Steps */
.el-step__title { color: var(--text-muted) !important; font-size: var(--font-size-base); }
.el-step__title.is-process { color: var(--text-primary) !important; font-weight: 600; }
.el-step__title.is-wait { color: var(--text-muted) !important; }
.el-step__title.is-finish { color: var(--primary) !important; }
.el-step__description { color: var(--text-muted) !important; font-size: var(--font-size-xs); }

/* Collapse */
.el-collapse { border-top-color: rgba(0, 136, 153, 0.15) !important; }
.el-collapse-item__header { color: var(--text-primary) !important; font-size: var(--font-size-md); background: transparent !important; border-bottom-color: rgba(0, 136, 153, 0.1) !important; }
.el-collapse-item__wrap { background: transparent !important; border-bottom-color: rgba(0, 136, 153, 0.1) !important; }
.el-collapse-item__content { color: var(--text-body) !important; font-size: var(--font-size-base); padding: 12px 0; }

/* Breadcrumb */
.el-breadcrumb__inner { color: var(--text-muted) !important; font-size: var(--font-size-sm); }
.el-breadcrumb__inner.is-link { color: var(--text-secondary) !important; }
.el-breadcrumb__inner.is-link:hover { color: var(--primary) !important; }
.el-breadcrumb__separator { color: var(--text-muted) !important; }

/* Dropdown */
.el-dropdown-menu { background: rgba(10, 22, 40, 0.98) !important; border: 1px solid rgba(0, 136, 153, 0.3) !important; border-radius: 10px !important; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4) !important; }
.el-dropdown-menu__item { color: var(--text-body) !important; font-size: var(--font-size-base); padding: 8px 16px !important; }
.el-dropdown-menu__item:hover { background: rgba(0, 229, 204, 0.1) !important; color: var(--text-primary) !important; }
.el-dropdown-menu__item.is-disabled { color: rgba(153, 199, 209, 0.4) !important; }

/* Popover */
.el-popover { background: rgba(10, 22, 40, 0.98) !important; border: 1px solid rgba(0, 136, 153, 0.3) !important; border-radius: 10px !important; color: var(--text-body) !important; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4) !important; }
.el-popover__title { color: var(--text-primary) !important; font-size: var(--font-size-md); font-weight: 600; }

/* Checkbox & Radio */
.el-checkbox__label { color: var(--text-body) !important; font-size: var(--font-size-base); }
.el-checkbox__input.is-checked + .el-checkbox__label { color: var(--primary) !important; }
.el-checkbox__inner { background: rgba(0, 136, 153, 0.1) !important; border-color: rgba(0, 136, 153, 0.3) !important; }
.el-checkbox__input.is-checked .el-checkbox__inner { background: var(--primary-dark) !important; border-color: var(--primary) !important; }
.el-radio__label { color: var(--text-body) !important; }
.el-radio__input.is-checked + .el-radio__label { color: var(--primary) !important; }
.el-radio__inner { background: rgba(0, 136, 153, 0.1) !important; border-color: rgba(0, 136, 153, 0.3) !important; }
.el-radio__input.is-checked .el-radio__inner { background: var(--primary-dark) !important; border-color: var(--primary) !important; }

/* Progress */
.el-progress__text { color: var(--text-body) !important; font-size: var(--font-size-sm); }
.el-progress-bar__innerText { color: var(--text-primary) !important; }

/* Link */
.el-link { font-size: var(--font-size-base); }
.el-link.el-link--default { color: var(--text-secondary) !important; }
.el-link.el-link--default:hover { color: var(--primary) !important; }

/* Upload */
.el-upload { color: var(--text-body) !important; }
.el-upload__input { color: var(--text-body) !important; }
.el-upload__tip { color: var(--text-muted) !important; font-size: var(--font-size-xs); }
.el-upload-list__item { color: var(--text-body) !important; font-size: var(--font-size-base); }
.el-upload-list__item-name { color: var(--text-body) !important; }
.el-upload-list__item-name:hover { color: var(--primary) !important; }

/* Descriptions */
.el-descriptions__title { color: var(--text-primary) !important; font-size: var(--font-size-lg); }
.el-descriptions__label { color: var(--text-secondary) !important; font-size: var(--font-size-base); }
.el-descriptions__content { color: var(--text-body) !important; font-size: var(--font-size-base); }
.el-descriptions__body { background: transparent !important; }
.el-descriptions__cell { border-bottom-color: rgba(0, 136, 153, 0.1) !important; }

/* Page Header */
.el-page-header { color: var(--text-primary) !important; }
.el-page-header__title { color: var(--text-primary) !important; font-size: var(--font-size-lg); }
.el-page-header__content { color: var(--text-body) !important; font-size: var(--font-size-md); }

/* Timeline */
.el-timeline-item__node { box-shadow: 0 0 0 3px rgba(0, 136, 153, 0.2) !important; }
.el-timeline-item__wrapper { color: var(--text-body) !important; }
.el-timeline-item__timestamp { color: var(--text-muted) !important; font-size: var(--font-size-xs); }
.el-timeline-item__content { color: var(--text-body) !important; font-size: var(--font-size-base); }

/* Rate */
.el-rate__text { color: var(--text-body) !important; font-size: var(--font-size-sm); }

/* Input Number */
.el-input-number .el-input__inner { text-align: center !important; }
.el-input-number__increase, .el-input-number__decrease { background: rgba(0, 136, 153, 0.1) !important; color: var(--text-secondary) !important; border-color: rgba(0, 136, 153, 0.15) !important; }
.el-input-number__increase:hover, .el-input-number__decrease:hover { background: rgba(0, 229, 204, 0.15) !important; color: var(--primary) !important; }

/* Result */
.el-result__title { color: var(--text-primary) !important; }
.el-result__subtitle { color: var(--text-body) !important; font-size: var(--font-size-base); }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(0, 136, 153, 0.2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(0, 136, 153, 0.35); }

/* Disabled state */
.el-input.is-disabled .el-input__wrapper { background: rgba(0, 136, 153, 0.04) !important; border-color: rgba(0, 136, 153, 0.1) !important; }
.el-input.is-disabled .el-input__inner { color: rgba(230, 247, 255, 0.4) !important; -webkit-text-fill-color: rgba(230, 247, 255, 0.4) !important; }
  </style>
</head>
